name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build .\TotalUpdaterNext.slnx -c Release --disable-build-servers
      - name: Regression tests
        run: dotnet run --project .\TotalUpdater.Next.Tests\TotalUpdater.Next.Tests.csproj -c Release --no-build
      - name: Validate embedded catalog
        shell: pwsh
        run: |
          $result = dotnet run --project .\TotalUpdater.Next.Tests\TotalUpdater.Next.Tests.csproj -c Release --no-build -- --validate-catalog
          $result | Write-Output
          $summary = $result | Select-Object -Last 1
          if ($LASTEXITCODE -ne 0 -or $summary -notmatch '^Entries=(\d+); errors=0$' -or [int]$Matches[1] -lt 150) { exit 1 }
      - name: Audit catalog aliases
        run: dotnet run --project .\TotalUpdater.Next.Tests\TotalUpdater.Next.Tests.csproj -c Release --no-build -- --audit-catalog-aliases
      - name: Validate harvested package evidence
        run: dotnet run --project .\TotalUpdater.Next.Tests\TotalUpdater.Next.Tests.csproj -c Release --no-build -- --validate-harvest-evidence
